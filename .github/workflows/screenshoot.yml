name: Ambil Screenshot Proyek

on:
  schedule:
    - cron: "0 0 * * *"  # Jalankan setiap hari jam 00:00 UTC
  workflow_dispatch:     # Izinkan dijalankan manual

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Screenshot dengan Puppeteer
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          const fs = require('fs');

          (async () => {
            const browser = await puppeteer.launch({ headless: true });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 800 });

            const sites = JSON.parse(fs.readFileSync('sites.json', 'utf8'));
            for (const site of sites) {
              try {
                console.log('📸 Mengambil screenshot untuk:', site.name);
                await page.goto(site.url, { 
                  waitUntil: 'networkidle0', 
                  timeout: 30000 
                });
                // Tunggu sebentar agar halaman benar-benar stabil
                await new Promise(r => setTimeout(r, 2000));
                await page.screenshot({ 
                  path: 'assets/images/' + site.name + '.png', 
                  fullPage: true 
                });
                console.log('✅ Screenshot berhasil:', site.name);
              } catch (error) {
                console.error('❌ Gagal screenshot untuk:', site.name, error.message);
              }
            }

            await browser.close();
          })();
          "

      - name: Commit dan Push Screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/*.png
          git diff --staged --quiet || git commit -m "🔄 Update screenshot proyek [skip ci]"
          git push
