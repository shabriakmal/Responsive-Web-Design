<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="form-container">
        <form>
            <h2>Advice & Complaint</h2>
            <label for="full-name">Full Name: 
                <input type="text" id="full-name" name="full-name" required placeholder="Enter your full name"/>
            </label>
            <label for="email">Email: 
                <input id="email" name="email" type="email" placeholder="Enter your email" required/>
            </label>
            <label for="message">Message: 
                <textarea id="message" name="message" placeholder="Enter your advice/complaint" rows="3" col="50" required></textarea>
            </label>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>

</html>
