<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css"/>
</head>

<body>
    <main>
        <h1>My To-Do-List</h1>
        <ul class="todo-list">
            <li>
                <input type="checkbox" id="course">
                <label for="course">Finish Responsive Web Design Course
                </label>
                <ul class="sub-item">
                    <li>
                      <a class="sub-item-link" href="https://www.freecodecamp.org/learn/responsive-web-design-v9/" target="_blank">Course Link</a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="ideal">
                <label for="ideal">Reach Ideal Weight with RUNNING</label>
                <ul class="sub-item">
                    <li>
                      <a class="sub-item-link" href="https://play.google.com/store/apps/details?id=running.tracker.gps.map&pcampaignid=web_share" target="_blank">Running Link</a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="strong">
                <label for="strong">Stronger with PULL UP</label>
                <ul class="sub-item">
                    <li>
                      <a class="sub-item-link" href="https://play.google.com/store/apps/details?id=com.shvagerfm.Pullupspro&pcampaignid=web_share" target="_blank">Pull Up Link</a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="memo">
                <label for="memo">Memorize Al Baqarah</label>
                <ul class="sub-item">
                    <li>
                      <a class="sub-item-link" href="https://quran.com/id/2" target="_blank">Al Baqarah Link</a>
                    </li>
                </ul>
            </li>
        </ul>
    </main>
</body>
</html>
