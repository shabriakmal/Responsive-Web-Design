<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Painting</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="house">
        <div id="chimney">
            <div id="chimney-top"></div>
        </div>
        <div id="roof">
            <div id="rooftile-hor-1"></div>
            <div id="rooftile-hor-2"></div>
            <div id="rooftile-ver-1"></div>
            <div id="rooftile-ver-2"></div>
            <div id="rooftile-ver-3"></div>
            <div id="rooftile-ver-4"></div>
            <div id="rooftile-ver-5"></div>
            <div id="rooftile-ver-6"></div>
            <div id="rooftile-ver-7"></div>
            <div id="rooftile-ver-8"></div>
        </div>
        <div id="window-1">
            <div id="window-transom"></div>
            <div id="window-mullion"></div>
        </div>
        <div id="window-2">
            <div id="window-transom"></div>
            <div id="window-mullion"></div>
        </div>
        <div id="door">
            <div id="door-knob"></div>
        </div>
    </div>
</body>
</html>
