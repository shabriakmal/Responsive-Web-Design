<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>
  <body>
    <header>
      <h1 id="title">Event Feedback Survey Form</h1>
      <p id="description">Thank you for participating in our event! Your feedback is incredibly valuable to us. Please take a few minutes to share your honest thoughts.</p>
    </header>
    <main>
      <form id="survey-form">
        <fieldset>
          <h2>Personal Information</h2></br>
          <label for="name" id="name-label">Full Name:</label>
          <input required type="text" id="name" name="name" placeholder="Enter your full name"/></br>
          <label for="email" id="email-label">Email:</label>
          <input required type="email" id="email" name="email" placeholder="example@mail.com"/></br>
          <label for="number" id="number-label">Age:</label>
          <input required type="number" id="number" name="age" min="1" max="100" placeholder="Enter your age" size="200"/></br>
        </fieldset>
        <fieldset>
          <h2>Event Details</h2>
          <label for="dropdown">Which event do you attend?</label>
          <select id="dropdown" name="event">
            <option value="" disabled selected>Select an event</option>
            <option value="conference">Annual Tech Conference</option>
            <option value="workshop">Digital Marketing Workshop</option>
            <option value="seminar">Leadership Seminar</option>
            <option value="networking">Networking Mixer</option>
            <option value="other">Other</option>
          </select></br>
          <label>How did you know about the event?</label></br>
          <input type="radio" id="social-media" name="referral" value="social-media"/>
          <label for="social-media">Social Media</label>
          <input type="radio" id="friend" name="referral" value="friend"/>
          <label for="friend">Friend/Colleague</label>
          <input checked type="radio" id="website" name="referral" value="website"/>
          <label for="website">Website</label>
        </fieldset>
        <fieldset>
          <h2>Event Rating</h2>
          <label for="rating">Overall, how would you rate the event?</label>
          <select id="rating" name="rating">
            <option value="excellent" selected>Excellent</option>
            <option value="good">Good</option>
            <option value="average">Average</option>
            <option value="poor">Poor</option>
          </select></br>
          <label>What aspects of the event did you enjoy? (Select all that apply)</label></br>
          <input type="checkbox" id="content" name="enjoyed" value="content"/>
          <label for="content">Content/Presentations</label>
          <input type="checkbox" id="speakers" name="enjoyed" value="speakers"/>
          <label for="speakers">Speakers</label>
          <input type="checkbox" id="venue" name="enjoyed" value="venue"/>
          <label for="venue">Venue</label>
          <input type="checkbox" id="networking" name="enjoyed" value="networking"/>
          <label for="networking">Networking Opportunities</label>
          <input type="checkbox" id="organization" name="enjoyed" value="organization"/>
          <label for="organization">Organization</label>
          <input type="checkbox" id="food" name="enjoyed" value="food"/>
          <label for="food">Food & Beverages</label>
        </fieldset>
        <fieldset>
          <h2>Additional Feedback</h2>
          <label for="comments">What could we improve for future events?</label>
          <textarea cols="35" rows="5" id="comments" name="comments"></textarea></br>
          <label for="suggests">What topics would you like to see in future events?</label>
          <textarea cols="35" rows="5" id="suggests" name="suggests"></textarea>
          <button type="submit" id="submit">Submit</button>
        </fieldset>
      </form>
    </main> 
  </body>
</html>
