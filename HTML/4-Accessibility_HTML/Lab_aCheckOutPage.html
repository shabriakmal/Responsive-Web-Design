<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Checkout Page</title>
</head>

<body>
  <h1>Checkout</h1>
  <section>
    <h2>Your Cart</h2>
    <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="rotating rubik's cube"/>
    <p>Rubik's Cube</p>
    <p>$12.49</p>
  </section>
  <section>
    <h2>Payment Information</h2>
    <form>
   <label for="card-name">Cardholder Name <span class="required" aria-hidden="true">*</span></label>
      <input required type="text" id="card-name" name="card-name"/></br>
  <label for="card-number">Card Number <span class="required" aria-hidden="true">*</span></label>
   <input required type="text" id="card-number" name="card-number" aria-describedby="card-number-help"/>
      <p id="card-number-help">Please enter your 16-digit card number without spaces or dashes.</p>
    </form>
    <button type="submit">Place Order</button>
  </section>
</body>

</html>
